# r2share 一键部署：push main = 自动发布到 Cloudflare Workers
#
# ── 需要配置的东西：2 个必填 Variable + 2 个必填 Secret ──────────────────────
#
# Settings → Secrets and variables → Actions → **Variables**（非敏感，明文可见，推荐放这里）
#   WORKER_DOMAIN           【必填】站点入口域，如 file.example.com（不带 http://）
#   DL_DOMAIN               【必填】R2 下载直链域，如 dl.example.com 或 <id>.r2.dev
#   CLOUDFLARE_ACCOUNT_ID   选填，账户 id（32 位十六进制）；只关联一个账户时可留空
#   BUCKET_NAME             选填，R2 桶名（默认 r2share）
#   SITE_NAME               选填，站点名称（默认 我的仓库）
#
# Settings → Secrets and variables → Actions → **Secrets**（敏感，加密存储）
#   CLOUDFLARE_API_TOKEN    【必填】带 Workers Scripts Edit + R2 权限的 API Token
#                           （R2 权限只在直传模式下会被用到——那时流水线要自动应用桶 CORS）
#   ADMIN_PASSWORD          【必填】管理口令
#   以下均可留空，留空即用自动推导 / 默认行为：
#   SESSION_SECRET          会话签名密钥。留空 → 从 ADMIN_PASSWORD 派生
#   R2_ACCESS_KEY_ID        仅当 UPLOAD_VIA_WORKER=0 走 presigned 直传时才需要
#   R2_SECRET_ACCESS_KEY    同上
#   R2_ACCOUNT_ID           留空 → 复用 CLOUDFLARE_ACCOUNT_ID（S3 端点同值）
#
# 流水线顺序：Validate（必填项 fail-fast）→ Test（单测门禁）→ Deploy → Sync secrets → Apply CORS（仅直传模式）
# 三步都在同一个 job 里，gen-config 产出的 wrangler.deploy.toml / cors.deploy.json 会留给后续步骤读。
#
# 两类变量都支持：同名配置会优先读 Variables，其次读 Secrets（向后兼容）。
# 域名、桶名这些不是密钥，放 Variables 的好处是随时可见、可改，不用「重新输入才看得到」。
#
# WORKER_DOMAIN / DL_DOMAIN 是硬性必填：它们只在部署时由 scripts/gen-config.mjs 注入
# 生成的 wrangler.deploy.toml，缺失会让 gen-config 退出码 1、部署中止——
# 这样别人 fork 后不可能「带着作者的域名」静默上线。
#
# 与手动 wrangler 部署的取舍：本流水线把这里当作权威来源，每次部署都会用它的值
# 覆盖 Cloudflare 端同名 secret——因此仓库里的值必须与生产一致，改 secret 请先在这里
# 修改再重跑，不要只改 CF 控制台。
name: Deploy r2share

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # 同分支连续 push 时，让新 run 自动取消进行中的旧 run，只保留最后一个，
    # 避免重复部署与日志刷屏（push-gh.sh 已改为单 commit，正常情况下一次 push 只触发一次）
    concurrency:
      group: deploy-r2share
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 必填项前置校验（fail fast）。
      # 为什么需要：ADMIN_PASSWORD 只影响 Worker secret，缺了照样能部署成功，
      # 但站点会变成「谁也登录不进去」的静默故障；放这里一次性把必填项暴露清楚，
      # 而不是等用户打开站点才发现。
      # ⚠️ 值一律经 env 传入，绝不把 ${{ secrets.* }} 直接插进 run: 脚本：
      # 口令里出现 " 会让脚本引号不配对（部署中止），出现 $(...) 或反引号则会在 runner 上
      # 执行任意命令 —— 而这个 runner 的 env 里就有 CLOUDFLARE_API_TOKEN。
      # 下面 Deploy / Sync secrets / Apply CORS 三个 step 用的也是同一写法。
      - name: Validate required config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN || secrets.WORKER_DOMAIN }}
          DL_DOMAIN: ${{ vars.DL_DOMAIN || secrets.DL_DOMAIN }}
        run: |
          set -euo pipefail
          miss=0
          need() { # $1=名称 $2=值
            if [ -z "${2:-}" ]; then
              echo "  ✗ 必填项缺失：$1"
              miss=1
            else
              echo "  ✓ $1 已配置"
            fi
          }
          need CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          need ADMIN_PASSWORD      "$ADMIN_PASSWORD"
          need WORKER_DOMAIN       "$WORKER_DOMAIN"
          need DL_DOMAIN           "$DL_DOMAIN"
          if [ "$miss" != 0 ]; then
            echo
            echo "补齐上面标记的项后重跑：域名等「配置」放 Variables 页，密钥放 Secrets 页。"
            exit 1
          fi

      # 部署前必跑测试。test-frontend.mjs 里那批跨端契约断言（前端 UPLOAD_CHUNK /
      # DELETE_CHUNK 不得超过服务端 MAX_COMMIT_BATCH / MAX_DELETE_BATCH、首页必须走 Worker、
      # CAS 语义…）只有在 CI 里真的执行才有意义 —— 否则改坏前后端任一侧都能直接上线。
      # 本 step 失败会中止整个 job，后面的 Deploy 不会执行。
      - name: Run tests
        run: npm test

      # npm run deploy 内部 = gen-config（注入域名，缺则失败）→ npm run check → wrangler deploy
      # WORKER_DOMAIN / DL_DOMAIN 是硬性必填：缺失/非法时 gen-config 退出码 1，部署中止。
      # 每个变量都先读 Variables、再退回 Secrets —— 两类都能配，不强制迁移。
      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN || secrets.WORKER_DOMAIN }}
          DL_DOMAIN: ${{ vars.DL_DOMAIN || secrets.DL_DOMAIN }}
          BUCKET_NAME: ${{ vars.BUCKET_NAME || secrets.BUCKET_NAME }}
          SITE_NAME: ${{ vars.SITE_NAME || secrets.SITE_NAME }}

      # 把配置同步为 Cloudflare Worker secrets。
      # 空值守卫：未配置的项（引用会展开成空字符串）跳过同步，保留 CF 端现有值，
      # 避免把已配置的生产密钥误清空（ADMIN_PASSWORD 已在上面强制校验过，不会走到这里为空）。
      # 留空即走自动推导（见 src/mode.ts）：
      #   SESSION_SECRET 空 → 从 ADMIN_PASSWORD 派生会话密钥
      #   R2_ACCOUNT_ID  空 → 取 CLOUDFLARE_ACCOUNT_ID 的值再同步（S3 端点就是
      #                      <account_id>.r2.cloudflarestorage.com，两者同值）。
      #                      注意「复用」发生在这里：Worker 运行时读的是 R2_ACCOUNT_ID，
      #                      不要把 CLOUDFLARE_ACCOUNT_ID 当成运行时可读的变量。
      # 注意顺序：首次部署前 Worker 还不存在，`wrangler secret put` 会报 worker not found，
      # 所以本步骤必须在 Deploy 之后。
      - name: Sync production secrets
        run: |
          set -euo pipefail
          # 与部署读同一份配置：仓库里的 wrangler.toml 只是模板（__TOKEN__ 占位 + 路由注释），
          # 拿它当「当前部署的配置」会引入隐性偏差；部署用的是 gen-config 产出的
          # wrangler.deploy.toml，这里保持一致。
          CFG=""
          if [ -f wrangler.deploy.toml ]; then CFG="--config wrangler.deploy.toml"; fi
          put() { # $1=secret名  $2=值；空值跳过，避免覆盖 CF 端现有配置
            local name="$1" val="${2:-}" attempt out
            if [ -z "$val" ]; then
              echo "  · $name 未配置，跳过（由代码自动推导 / 保留 CF 端现有值）"
              return 0
            fi
            # 失败重试 3 次（覆盖 Cloudflare API 偶发 5xx / 限流），
            # 但每次失败都打印 wrangler 的真实输出——绝不能像以前那样丢进 /dev/null，
            # 否则 CI 只剩一句「同步失败」，根本无从排查。
            for attempt in 1 2 3; do
              if out=$(printf '%s\n' "$val" | npx wrangler secret put "$name" --name r2share $CFG 2>&1); then
                echo "  ✓ $name 已同步"
                return 0
              fi
              echo "  … $name 第 ${attempt} 次失败，wrangler 输出："
              printf '%s\n' "$out" | tail -8 | sed 's/^/      /'
              if [ "$attempt" -lt 3 ]; then sleep 2; fi
            done
            echo "  ✗ $name 同步失败（已重试 3 次）"
            echo "  --- 诊断：当前 wrangler 身份与权限 ---"
            npx wrangler whoami $CFG 2>&1 | tail -15 || true
            exit 1
          }
          # 与 Validate 同理：经 env 传入，不直插脚本。
          # set -u 下必须用 ${VAR:-}，未配置的项定位到空值后由 put() 内部跳过。
          put ADMIN_PASSWORD        "${ADMIN_PASSWORD:-}"
          put SESSION_SECRET        "${SESSION_SECRET:-}"
          put R2_ACCESS_KEY_ID      "${R2_ACCESS_KEY_ID:-}"
          put R2_SECRET_ACCESS_KEY  "${R2_SECRET_ACCESS_KEY:-}"
          # `${VAR:-}` 双保险：本步骤用了 set -u，若哪天 env 段被改动导致
          # CLOUDFLARE_ACCOUNT_ID 未定义，脚本会以「unbound variable」崩掉，
          # 而不是给出一个能看懂的「未配置，跳过」。
          put R2_ACCOUNT_ID         "${R2_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID:-}}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # 桶 CORS：**只在 presigned 直传模式**（UPLOAD_VIA_WORKER != "1"）下才需要。
      # 默认模式（"1"）浏览器 PUT 打的是本 Worker 的同源 /api/local-put，不触发跨域预检，
      # 所以这里先读 gen-config 产出的配置判断模式：默认模式直接跳过，
      # 既不给用户添一个必配步骤，也避免无谓地要求 API Token 带 R2 权限。
      # 注意：桶必须先存在（README 第 1 步创建 R2 桶），这也是本步骤排在 Deploy 之后的原因之一。
      - name: Apply bucket CORS (直传模式才需要)
        run: |
          set -euo pipefail
          if grep -qE '^[[:space:]]*UPLOAD_VIA_WORKER[[:space:]]*=[[:space:]]*"1"' wrangler.deploy.toml; then
            echo "  · UPLOAD_VIA_WORKER=1（上传走 Worker 同源代理），不需要 CORS，跳过"
            exit 0
          fi
          if [ ! -f cors.deploy.json ]; then
            echo "  ✗ 直传模式必须有 CORS，但 cors.deploy.json 不存在（gen-config 未产出）"
            exit 1
          fi
          echo "  · 直传模式：把 cors.deploy.json 应用到桶 ${BUCKET_NAME:-r2share}"
          npx wrangler r2 bucket cors set "${BUCKET_NAME:-r2share}" --file cors.deploy.json
          npx wrangler r2 bucket cors list "${BUCKET_NAME:-r2share}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET_NAME: ${{ vars.BUCKET_NAME || secrets.BUCKET_NAME }}
